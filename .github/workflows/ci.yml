name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite (node --test)
        run: npm test

      - name: Verify index.html stat counters are in sync
        run: node scripts/sync-stats.js --check

      - name: Build Tailwind CSS and sync index.html stats
        run: npm run build

      - name: Fail on uncommitted build output (css/tailwind.css, index.html)
        run: git diff --exit-code css/tailwind.css index.html
